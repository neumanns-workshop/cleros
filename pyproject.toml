[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleros"
description = "Ancient Greek Religious Corpus"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "CC0-1.0"}
dynamic = ["version"]

[tool.black]
line-length = 88
target-version = ['py38']
exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | \.env
  | _build
  | build
  | dist
  | attic
  | node_modules
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
skip_glob = ["attic/*"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".env",
    "attic",
    "node_modules"
]

[tool.pylint]
ignore-paths = ["attic"]

[tool.mypy]
exclude = [
    "attic/",
    "build/",
    "dist/"
]

